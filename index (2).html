}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:500 14px/1.25 var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column;min-width:0}

/* controls */
.btn{height:30px;min-width:30px;padding:0 10px;border-radius:2px;border:1px solid var(--line);background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ico{padding:0;width:30px}
.btn.ico svg{width:16px;height:16px}
.btn.big{height:34px;width:38px}
.btn.sm{height:24px;min-width:24px;padding:0 7px;font-size:13px;border-radius:2px}
.btn.sm.ico{width:24px;padding:0}
.btn:disabled{opacity:.4;cursor:default}
select,input[type=number]{height:30px;border-radius:2px;border:1px solid var(--line);background:var(--raised);padding:0 6px}
input[type=number]{width:64px;font-family:var(--font-num)}
.field{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.field select,.field input{color:var(--text)}
.sp{flex:1}
.sep{width:1px;height:22px;background:var(--line)}
.muted{color:var(--muted)}
.num{font-family:var(--font-num);font-size:12px}
.grp-i{display:flex;align-items:center;gap:4px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:0;background:var(--sunk);border:1px solid var(--line);margin:0;min-width:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--c,var(--accent));border:none}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--c,var(--accent));border:none}

/* top bar */
#top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.01em;margin-right:6px}
.brand svg{width:22px;height:22px}
.lcd{font-family:var(--font-num);font-size:18px;background:var(--sunk);border:1px solid var(--line);border-radius:2px;padding:3px 12px;min-width:112px;text-align:center}
.seg2{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg2 button{border:none;background:var(--raised);height:28px;padding:0 10px}
.seg2 button.on{background:var(--accent);color:var(--accent-ink)}
.meter{width:34px;height:6px;border-radius:0;background:var(--sunk);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--c,var(--accent));transform-origin:left;transform:scaleX(0)}
.meter.big{width:90px;height:8px}
.mv{display:flex;align-items:center;gap:8px}
.mv input{width:90px}

/* arranger */
#arr{flex:0 1 auto;max-height:40%;min-height:96px;overflow:auto;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
#arrInner{position:relative;min-width:100%}
.row{display:flex;height:var(--rh,46px)}
.chead{position:sticky;left:0;z-index:3;width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px 4px 12px}
.row.ch .chead{box-shadow:inset 5px 0 0 var(--c);cursor:pointer}
.row.ch.selrow .chead{background:var(--raised)}
.l1{display:flex;align-items:center;gap:4px;height:22px}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:15px}
.name-in{flex:1;min-width:0;height:22px;border:1px solid var(--accent);border-radius:0;background:var(--raised);padding:0 4px;font-weight:600}
.l2{display:flex;align-items:center;gap:6px;height:16px;margin-top:2px}
.l2 input[type=range]{flex:1}
.l2 input.pan{flex:none;width:44px}
.btn.m.on{background:#e8913a;color:#201004}
.btn.s.on{background:#e9d34b;color:#241d02}
.btn.del{opacity:0}
.row.ch:hover .btn.del{opacity:1}
.ruler{position:sticky;top:0;z-index:4;height:26px;background:var(--panel)}
.ruler .chead{height:26px;display:flex;align-items:center;gap:6px;padding-top:0;padding-bottom:0;z-index:5}
.barh{width:var(--cw,64px);flex:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font:12px/26px var(--font-num);padding-left:6px;color:var(--muted);cursor:pointer;position:relative}
.barh.q{color:var(--text)}
.barh.start::after{content:'';position:absolute;left:0;top:0;border:5px solid transparent;border-left-color:var(--accent);border-top-color:var(--accent)}
.barh.sel{background:var(--raised)}
.cell{width:var(--cw,64px);flex:none;position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;touch-action:none}
.cell.q{border-left:1px solid var(--grid-3)}
.cell canvas{position:absolute;left:1px;top:0;width:calc(var(--cw,64px) - 2px);height:calc(var(--rh,46px) - 1px);display:block}
.cell.has{background:color-mix(in srgb,var(--c) 20%,transparent)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
.cell .pn{position:absolute;right:4px;bottom:2px;font:11px var(--font-num);color:var(--text);opacity:.75}
.row.ch.dim canvas{opacity:.3}
.addrow{height:38px}
.addhead{display:flex;align-items:center;box-shadow:none}
.playhead{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--accent);z-index:2;pointer-events:none;display:none}

/* piano roll */
#roll{flex:1 1 0;min-height:200px;display:flex;flex-direction:column;min-width:0}
.rollbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.chip::before{content:'';width:10px;height:10px;border-radius:0;background:var(--c,var(--muted))}
#rollWrap{flex:1;position:relative;min-height:0;background:var(--row-out)}
#rollCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* floating instrument windows */
.win{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow);max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto}
.win-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);border-top:3px solid var(--c);border-radius:2px 2px 0 0;cursor:grab;user-select:none;touch-action:none;position:sticky;top:0;background:var(--panel);z-index:2}
.win-h:active{cursor:grabbing}
.win-h .t{font-weight:700;font-size:15px}
.win-h .st{color:var(--muted);flex:1}
.win-h select{height:26px}
.groups{display:flex;flex-wrap:wrap;gap:8px;padding:10px;max-width:640px}
.grp{border:1px solid var(--line);border-radius:2px;padding:6px 8px 8px;background:var(--raised)}
.grp h4{margin:0 0 4px;font:600 13px var(--font-ui);color:var(--muted)}
.ks{display:flex;gap:2px;flex-wrap:wrap;max-width:300px}
.knob{width:58px;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;cursor:ns-resize}
.knob svg{width:44px;height:44px;display:block}
.knob .kl{font-size:11px;color:var(--muted);line-height:1.15}
.knob .kv{font:11px var(--font-num);line-height:1.3}
.segp{width:58px;display:flex;flex-direction:column;align-items:center}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;width:56px;margin-top:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:0;font-size:11px;height:20px;padding:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.kbfoot{display:flex;align-items:center;gap:8px;padding:0 10px 10px}
.kbd{position:relative;display:flex;height:70px;flex:1;min-width:300px}
.wk{flex:1;border:1px solid var(--line);background:var(--key-white);border-radius:0 0 0 0;touch-action:none}
.bk{position:absolute;top:0;height:62%;background:var(--key-black);border-radius:0 0 0 0;z-index:2;touch-action:none}
.wk.on,.bk.on,.pad.on{background:var(--accent)}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.pad{height:34px;border-radius:2px;border:1px solid var(--line);background:var(--raised);touch-action:none}

/* menus + help */
.menu{position:fixed;z-index:60;background:var(--raised);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow);padding:4px;min-width:170px}
.menu .mi{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:2px}
.menu .mi:hover{background:var(--accent-soft,var(--panel))}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,8,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:2px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px 20px}
.modal h3{margin:0 0 8px;font-size:18px}
.modal dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.modal dt{font-family:var(--font-num);font-size:12px;color:var(--muted);padding-top:2px}
.modal dd{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  background:linear-gradient(135deg,transparent 52%,var(--muted) 52%,var(--muted) 58%,transparent 58%,transparent 72%,var(--muted) 72%,var(--muted) 78%,transparent 78%)}
.ks.col{flex-direction:column;max-width:none;gap:6px;width:100%}

canvas.envv{width:176px;height:46px;border:1px solid var(--line);border-radius:2px;background:var(--sunk);display:block;margin-bottom:4px;flex:none}

.smp{display:flex;align-items:center;gap:6px;width:100%}

.smpname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfbox{display:flex;flex-direction:column;gap:8px;min-width:300px;width:100%}
.sfstat{color:var(--text);font-size:13px;line-height:1.35}
.sfrow{display:flex;align-items:center;gap:6px}

/* mixer */
.mixrow{display:flex;gap:6px;padding:8px;align-items:stretch;min-height:100%;width:max-content}

.addfx{width:100%}
.msends{display:flex;justify-content:center;gap:2px}
.fwrap{display:flex;gap:6px;justify-content:center;margin-top:auto}
.fader{position:relative;width:36px;height:150px;touch-action:none;cursor:ns-resize}

/* ---- responsive sizing: everything scales with the window ---- */
:root{--kw:58px;--ks:44px;--sw:112px;--pad:8px}

/* ---- one consistent panel layout: panels tile the window and stretch to fill it ---- */
:root{--kw:clamp(52px,calc(30px + 1.6vw),76px);--ks:calc(var(--kw)*.76);--sw:clamp(100px,calc(70px + 3vw),150px)}

/* ---------- base ---------- */
html,body{background:var(--bg)}
body{font:500 13px/1.25 var(--font-ui);letter-spacing:.005em}
::selection{background:var(--accent);color:var(--accent-ink)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 50%,transparent) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 45%,transparent);border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 75%,transparent);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:0}

/* ---------- buttons and fields ---------- */
.btn{height:26px;min-width:26px;padding:0 9px;border-radius:0;border:1px solid var(--line);background:var(--raised);color:var(--text);font-size:12.5px;font-weight:600;transition:none}
.btn:hover{border-color:var(--line);background:color-mix(in srgb,var(--raised) 84%,var(--text))}
.btn:active{background:color-mix(in srgb,var(--raised) 70%,var(--text))}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--line)}
.btn.on:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn.sm{height:22px;min-width:22px;padding:0 7px;font-size:12px;border-radius:0}
.btn.ico{padding:0;width:26px}.btn.sm.ico{width:22px;padding:0}
.btn.big{height:30px;width:38px}
.btn:disabled{opacity:.38}
.btn.m.on{background:var(--accent);color:var(--accent-ink)}
.btn.s.on{background:var(--solo);color:#04101c}
:where(select,input[type=number],input[type=text],input[type=search]){height:26px;border-radius:0;border:1px solid var(--line);background:var(--sunk);color:var(--text);padding:0 7px}
:where(select){background:var(--raised);font-weight:600;padding-right:2px}
:where(select,input):where(:hover){border-color:color-mix(in srgb,var(--line) 55%,var(--muted))}
:where(input[type=number]){font-family:var(--font-num);font-size:13px;text-align:center;width:58px}
:where(input::placeholder){color:var(--muted);opacity:.8}
select option{background:var(--raised);color:var(--text)}
.field{gap:5px;color:var(--muted)}
.field>span{font-size:11.5px;font-weight:600}
.sep{height:18px;background:var(--line);opacity:.7}
input[type=range]{height:14px;background:none;border:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--sunk);border:1px solid var(--line);border-radius:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:14px;margin-top:-6px;border-radius:0;background:var(--c,var(--accent));border:1px solid rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:4px;background:var(--sunk);border:1px solid var(--line);border-radius:0}
input[type=range]::-moz-range-thumb{width:7px;height:14px;border-radius:0;background:var(--c,var(--accent));border:1px solid rgba(0,0,0,.5)}
input[type=range]:focus-visible{outline-offset:2px}

/* ---------- control bar: one tidy row, scrolls instead of wrapping ---------- */
#top{display:flex;flex-wrap:nowrap;align-items:center;gap:7px;padding:6px 10px;min-height:44px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#top>*{flex:none}
#top>.sp{flex:1 1 6px;min-width:0}
.tg{display:flex;align-items:center;gap:4px;padding-right:6px;border-right:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.tg:last-of-type{border-right:0}
.tg.noedge{border-right:0}
#bPlay.on{background:var(--ok);color:#06210f}
#bPlay svg,#bStop svg{width:15px;height:15px}
.lcd{font:500 16px/1 var(--font-num);background:var(--sunk);color:var(--text);border:1px solid var(--line);border-radius:0;height:30px;min-width:98px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;letter-spacing:.05em}
.seg2{border:1px solid var(--line);border-radius:0;overflow:hidden}
.seg2 button{height:24px;padding:0 10px;font-size:12.5px;font-weight:600;background:var(--raised);border:0;border-right:1px solid var(--line)}
.seg2 button:last-child{border-right:0}
.seg2 button:hover:not(.on){background:color-mix(in srgb,var(--raised) 84%,var(--text))}
.seg2 button.on{background:var(--accent);color:var(--accent-ink)}
#pname{width:150px;flex:none;font-weight:600;text-overflow:ellipsis}
.tapb{height:26px}
.zoomgrp{gap:0}
.zoomgrp .btn{min-width:24px}
.zoomgrp .btn:not(:first-child){border-left-width:0}
.mv{flex-direction:column;align-items:stretch;gap:2px;width:96px}

.mv input{width:100%}
.meter{background:var(--sunk);border:1px solid var(--line);height:6px}

#mMeter{width:100%}
.ib{opacity:.55;background:transparent;border-color:color-mix(in srgb,var(--muted) 60%,transparent);margin-left:2px}
.ib:hover,.ib:focus-visible,.ib.open{opacity:1}

/* ---------- song grid ---------- */
#arr{background:var(--panel);border-bottom:0}
.ruler{background:var(--panel)}
.barh{font:11px/26px var(--font-num);color:var(--muted);border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.barh.q{color:var(--text)}
.barh.sel{background:color-mix(in srgb,var(--accent) 28%,var(--panel));color:var(--text)}
.chead{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.row.ch .chead{--hc:color-mix(in srgb,var(--c) 20%,var(--panel));background:var(--hc);box-shadow:inset 5px 0 0 var(--c)}

.row.ch.dim .chead{background:color-mix(in srgb,var(--c) 6%,var(--panel))}
.row.ch.dim .name{opacity:.55}

.cell{background:color-mix(in srgb,var(--row-in) 40%,var(--panel));border-right:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-bottom:1px solid var(--line)}
.cell.q{border-left:1px solid var(--grid-3)}

.cell.has{background:color-mix(in srgb,var(--c) 68%,var(--panel))}
.cell.has::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);z-index:1;pointer-events:none}
.cell .pn{color:var(--clip-ink);opacity:.9;font-weight:600}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cell.msel{background-color:color-mix(in srgb,var(--c) 68%,var(--accent) 14%)}
.row.ch.dim canvas{opacity:.4}
.row.ch.dim .cell.has{background:color-mix(in srgb,var(--c) 30%,var(--panel))}
.clip{background:color-mix(in srgb,var(--c) 68%,var(--panel))}
.clip span{color:var(--clip-ink);text-shadow:none;font-weight:700}
.playhead{width:2px;background:var(--text);opacity:.85}
.addrow{position:sticky;bottom:0;z-index:4;background:var(--panel);height:36px}
.addrow .chead{height:36px;display:flex;align-items:center;border-top:1px solid var(--line)}
.row.ch .l1 .btn.ico{background:color-mix(in srgb,var(--c) 12%,var(--raised))}
.row.ch .l1 .btn.m.on{background:var(--accent)}
.row.ch .l1 .btn.s.on{background:var(--solo)}
.meter{width:30px}
#split{height:7px;background:var(--sunk);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#split::after{top:2px;height:2px;background:var(--muted);opacity:.6;width:36px}
#split:hover,#split:focus-visible{background:var(--accent)}
#split:hover::after{background:var(--accent-ink)}

/* ---------- piano roll toolbar: two compact rows ---------- */
.rollbar{display:flex;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:0;padding:0;background:var(--panel);border-bottom:1px solid var(--line)}
.rb-row{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding:4px 10px;min-height:32px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.rb-row::-webkit-scrollbar{display:none}
.rb-row+.rb-row{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.rb-row>*{flex:none}
.rb-row>.sp{flex:1 1 6px;min-width:0}
#rbChan.chip{display:inline-flex;flex-direction:row;align-items:center;gap:7px;border:0;background:none;padding:0;min-width:0;cursor:default;font-size:13.5px;font-weight:700}
#rbChan.chip::before{content:'';width:10px;height:10px;background:var(--c,var(--muted))}
.chips .chip{display:inline-flex;flex-direction:column;align-items:center;min-width:54px;border:1px solid var(--line);background:var(--raised);border-radius:0;padding:4px 10px;cursor:grab;font-weight:600}
.chips .chip small{font:10px var(--font-num);color:var(--muted)}
.chips .chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chips .chip:active{cursor:grabbing}
#rollWrap{background:var(--row-out)}
#rollPh{width:2px;background:var(--text);opacity:.85}
.qol{border-radius:0;border:1px solid var(--line)}

/* ---------- floating windows (instruments, effects, mixer) ---------- */
.win{border-radius:0;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.win-h{border-radius:0;border-top:0;border-bottom:1px solid var(--line);padding:6px 6px 6px 10px;background:color-mix(in srgb,var(--c) 52%,var(--panel));color:#0e0e0e}
.win-h .t{font-size:14px;font-weight:700;color:#0e0e0e}
.win-h .st{color:rgba(0,0,0,.62);font-weight:600}
.win-h .st.dup{font-size:0}
.win-h .btn{background:rgba(0,0,0,.14);border-color:rgba(0,0,0,.38);color:#0e0e0e}
.win-h .btn:hover{background:rgba(0,0,0,.28)}
.win-h .btn.on{background:#111;color:var(--accent)}
.win-h .ib{color:#0e0e0e;border-color:rgba(0,0,0,.45);background:transparent;opacity:.7}
.win-h .ib:hover,.win-h .ib.open{background:#111;color:var(--accent);border-color:#111;opacity:1}
.grp{border-radius:0;background:color-mix(in srgb,var(--raised) 55%,var(--panel));border:1px solid var(--line)}
.grp h4{font:700 12px var(--font-ui);color:var(--muted)}
.presetbar,.tabs{background:var(--panel)}
.tab{border-radius:0;background:var(--sunk)}
.tab.on{background:var(--raised);box-shadow:inset 0 2px 0 var(--accent)}
.ppick{border-radius:0;background:var(--sunk)}
.pitem,.pcat,.ppanel,.psearch{border-radius:0}
.rz{opacity:.7}
.win.closing{animation-duration:.12s}
.seg button{border-radius:0}
.pad{border-radius:0}
.wk,.bk{border-radius:0}
.wk{border-color:#8a8a8a}
canvas.envv,canvas.swave,.wavep canvas,canvas.eqg,canvas.algv,.wtv{border-radius:0}

/* ---------- mixer ---------- */
.mstrip{border-radius:0;border:1px solid var(--line);border-top:0;background:var(--panel);box-shadow:inset 0 4px 0 var(--c)}
.mstrip{padding-top:10px}
.mstrip.cur{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-color:var(--line)}
.slot{border-radius:0;background:var(--raised);border-color:var(--line)}
.addfx{border-radius:0}
.fader .fth{background:var(--raised);border:2px solid var(--c)}
.mixtools{border-bottom:1px solid var(--line)}
.loudlcd{border-radius:0}

/* ---------- menus, dialogs, toasts ---------- */
.menu{border-radius:0;border:1px solid var(--line);padding:2px;background:var(--raised)}
.menu .mi{border-radius:0;padding:6px 10px}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--accent);color:var(--accent-ink);outline:none}
.menu .mi:hover .subcaret{color:inherit}
.modal{background:rgba(0,0,0,.5)}
.modal .card{border-radius:0;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.modal h3{font-size:16px}
.toast{border-radius:0;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--raised)}
.snavb{border-radius:0}
.snavb.on{background:var(--accent);color:var(--accent-ink)}
.ibpop{border-radius:0}
.apop{border-radius:0}
.wk.on,.bk.on,.pad.on{background:var(--accent)}

/* ---------- responsive: keep chrome short on small screens ---------- */
#top .ib{display:none}
@media (max-width:1180px){ .zoomgrp{display:none} #pname{width:110px} }
@media (max-width:1100px){ #pname{display:none} #top .field>span{display:none} .mv{width:72px} }
@media (max-width:640px){
  #top{padding:5px 8px;gap:6px}
  .rb-row{padding:3px 8px}
}
@media (max-height:700px){ #top{min-height:40px;padding-top:4px;padding-bottom:4px} .rb-row{min-height:28px;padding-top:2px;padding-bottom:2px} }
.toast{width:max-content}

</style>

<div id="unsupported" role="alert"><h1>Not supported on this device</h1><p id="unsupportedMsg">Pattern Loops is a music studio built for a computer with a keyboard and mouse. Please open it on a desktop or laptop.</p><button id="unsupportedGo" type="button">Continue anyway</button></div>
<script>
(function(){
  const root=document.documentElement; let allowed=false;
  const isPhone=()=>/iPhone|iPod|Android.+Mobile|Windows Phone/i.test(navigator.userAgent)||(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<700);
  function check(){
    const ph=isPhone(),show=!allowed&&(ph||innerWidth<620); root.classList.toggle('unsupported',show);
    const m=document.getElementById('unsupportedMsg'); if(m)m.textContent=ph?'Pattern Loops is a music studio built for a computer with a keyboard and mouse. Please open it on a desktop or laptop.':'This window is too small for Pattern Loops. Make it wider to continue.';
    const app=document.getElementById('app'); if(app)app.inert=show;
  }
  check(); addEventListener('resize',check); addEventListener('orientationchange',check);
  addEventListener('keydown',e=>{ if(root.classList.contains('unsupported'))e.stopImmediatePropagation(); },true);
  document.addEventListener('DOMContentLoaded',()=>{ check(); const b=document.getElementById('unsupportedGo'); if(b)b.onclick=()=>{ allowed=true; check(); }; });
})();
</script>

/* =====================================================================

const $=(s,r=document)=>r.querySelector(s);

const midiName=p=>NOTE_NAMES[((p%12)+12)%12]+(Math.floor(p/12)-1);

const FONT_NUM='"MonospaceTypewriter",ui-monospace,Menlo,monospace';

function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style'&&typeof v==='object'){for(const s in v){if(s.startsWith('--'))e.style.setProperty(s,v[s]);else e.style[s]=v[s];}}
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);

  return e;
}
const btn=(label,fn,cls='btn sm',title)=>el('button',{class:cls,type:'button',title,onclick:fn,html:/^[<&]/.test(label)?label:null},/^[<&]/.test(label)?null:label);

const ICON={
  play:'<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',

/* ---------- waveforms (sample functions -> PeriodicWave) ---------- */
const TAU=Math.PI*2;
const NATIVE_WAVES={sine:1,triangle:1,sawtooth:1,square:1};
const triW=p=>1-4*Math.abs(((p+.25)%1)-.5);
const vowelW=(forms,p)=>{let s=0;for(let k=1;k<=40;k++){const f=k*110;let a=0;for(const F of forms)a+=Math.exp(-Math.pow((f-F)/220,2));s+=a*Math.sin(TAU*k*p)/Math.sqrt(k);}return s;};
const WAVEFN={
  sine:p=>Math.sin(TAU*p), triangle:triW, sawtooth:p=>2*p-1, square:p=>p<.5?1:-1,
  pulse:(p,w)=>p<w?1:-1,
  nesTri:p=>Math.min(15,Math.floor((triW(p)+1)/2*16))/15*2-1,
  stairs:p=>Math.floor(p*6)/5*2-1,
  halfSine:p=>Math.max(0,Math.sin(TAU*p))*2-1,
  organ:p=>Math.sin(TAU*p)+.7*Math.sin(TAU*2*p)+.5*Math.sin(TAU*3*p)+.35*Math.sin(TAU*4*p)+.25*Math.sin(TAU*6*p)+.15*Math.sin(TAU*8*p),
  vowelA:p=>vowelW([800,1150,2900],p), vowelO:p=>vowelW([450,800,2830],p),
  buzz:p=>{let s=0;for(let k=1;k<=24;k++)s+=Math.sin(TAU*k*p)/Math.sqrt(k);return s;},
  digital:p=>{let s=0;for(let k=1;k<=14;k++)s+=Math.abs(Math.sin(k*78.233))*Math.sin(TAU*k*p+k)/Math.pow(k,.7);return s;},
  softSaw:p=>{let s=0;for(let k=1;k<=20;k++)s+=Math.sin(TAU*k*p)/Math.pow(k,1.5);return s;},
  glass:p=>[1,2,4,5,8].reduce((s,k)=>s+Math.sin(TAU*k*p)/k,0)
};
const WAVE_LIST=[['sine','Sine'],['triangle','Triangle'],['sawtooth','Saw'],['square','Square'],['pulse','Pulse'],['nesTri','NES triangle'],['stairs','Stairs'],['halfSine','Half sine'],['organ','Organ'],['vowelA','Vowel A'],['vowelO','Vowel O'],['buzz','Buzz'],['digital','Digital'],['softSaw','Soft saw'],['glass','Glass']];
const waveCache=new Map();
function getWave(c,name,pw){
  const q=name==='pulse'?Math.round(clamp(pw,0.03,0.5)*100)/100:0, key=name+q;
  const hit=waveCache.get(key); if(hit&&hit.c===c)return hit.w;
  const N=1024,H=96,fn=WAVEFN[name]||WAVEFN.sine,x=new Float32Array(N);
  for(let i=0;i<N;i++)x[i]=fn(i/N,q);
  const re=new Float32Array(H+1),im=new Float32Array(H+1);
  for(let k=1;k<=H;k++){let a=0,b=0;for(let i=0;i<N;i++){const ph=TAU*k*i/N;a+=x[i]*Math.cos(ph);b+=x[i]*Math.sin(ph);}re[k]=a*2/N;im[k]=b*2/N;}
  const w=c.createPeriodicWave(re,im); waveCache.set(key,{c,w}); return w;
}
const noiseCache={};
function noiseBufs(c){
  if(noiseCache.c===c)return noiseCache;
  const len=c.sampleRate*2,w=c.createBuffer(1,len,c.sampleRate),d=w.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const per=c.createBuffer(1,93,c.sampleRate),pd=per.getChannelData(0); let s=7;
  for(let i=0;i<93;i++){ s=(s*1103515245+12345)&0x7fffffff; pd[i]=(s&1)?1:-1; }
  noiseCache.c=c; noiseCache.white=w; noiseCache.periodic=per; return noiseCache;
}
function driveCurve(a){ const n=1024,k=1+a*40,cv=new Float32Array(n),th=Math.tanh(k); for(let i=0;i<n;i++){const x=i/(n-1)*2-1;cv[i]=Math.tanh(k*x)/th;} return cv; }

  };

  const v=s.inst.noteOn(pitch,vel,ctx.currentTime,{live:true}); if(v)liveMap.set(key,v); const rec={p:pitch,start:ctx.currentTime,end:Infinity}; logPlayed(ch.id,rec); return {s,v,rec};
}

function tapTempo(){
  const now=performance.now(); if(tapTimes.length&&now-tapTimes[tapTimes.length-1]>2000)tapTimes=[]; tapTimes.push(now); if(tapTimes.length>6)tapTimes.shift();
  if(tapTimes.length<2)return; let sum=0; for(let i=1;i<tapTimes.length;i++)sum+=tapTimes[i]-tapTimes[i-1];
  const bpm=clamp(Math.round(60000/(sum/(tapTimes.length-1))),40,300); if(bpm!==P.bpm){ commit(); P.bpm=bpm; $('#bpm').value=bpm; touchSave(); }
}
async function addSf2Channel(file){
  commit(); const ch=newChannel(P,'sf2','Default',file.name.replace(/\.[^.]+$/,'').slice(0,22)||'Soundfont'); P.channels.push(ch); sel.ch=P.channels.length-1; selNotes.clear();
  ensureAudio(); syncEngine(); const i=strips.get(ch.id).inst; const ok=await i.load(await file.arrayBuffer(),file.name); if(ok)ch.params.sfname=file.name;
  buildArranger(); updateRollBar(); R.dirty=true; openWin(ch.id); touchSave();
}
window.addEventListener('dragover',e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault(); });
window.addEventListener('drop',e=>{
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f)return; e.preventDefault(); const n=f.name.toLowerCase();
  if(/\.(patl|zip)$/.test(n))openProjectFile(f); else if(n.endsWith('.sf2'))addSf2Channel(f);
  else if(/\.(mid|midi)$/.test(n))importMidiFile(f);
  else if(/\.(wav|mp3|ogg|flac|m4a|aac|aif|aiff)$/.test(n)||(f.type||'').startsWith('audio/'))addSampleChannel(f);
  else toast('Pattern Loops opens .patl projects, .sf2 soundfonts and audio files.');
});

function defaultsFor(type){ const o={}; for(const p of INSTR[type].params)if(p.id&&p.def!==undefined)o[p.id]=Array.isArray(p.def)?p.def.slice():p.def; return o; }

   ENGINE: audio graph, channel strips, scheduler
   ===================================================================== */
let ctx=null,limiter=null,masterAn=null,metroGain=null;
let strips=new Map();
const play={on:false,pos:0,nextTime:0,timer:null,queue:[],disp:null,ending:false};
const ui={mode:'song',loop:true,metro:false,startBar:0};

class FxChain{
  constructor(src,dst){ this.src=src; this.dst=dst; this.nodes=new Map(); this.sig=null; }
  sync(list){
    const ids=new Set(list.map(f=>f.id));
    for(const [id,n] of [...this.nodes]){ if(!ids.has(id)){ n.dispose(); this.nodes.delete(id); this.sig=null; } }
    for(const f of list){
      let n=this.nodes.get(f.id);
      if(!n){ n=new FX[f.type].cls(ctx,f.params); this.nodes.set(f.id,n); this.sig=null; } else n.setValues(f.params);
    }
    const sig=list.map(f=>f.id+(f.bypass?'-':'+')).join('|');
    if(sig===this.sig)return; this.sig=sig;
    try{this.src.disconnect();}catch(e){}
    for(const n of this.nodes.values()){ try{n.out.disconnect();}catch(e){} }
    let prev=this.src;
    for(const f of list){ if(f.bypass)continue; const n=this.nodes.get(f.id); prev.connect(n.in); prev=n.out; }
    prev.connect(this.dst);
  }
  get(id){ return this.nodes.get(id); }
  reset(){ for(const n of this.nodes.values()){ try{ n.dispose(); }catch(e){} } this.nodes.clear(); this.sig=null; }
  dispose(){ for(const n of this.nodes.values())n.dispose(); this.nodes.clear(); try{this.src.disconnect();}catch(e){} }
}
let masterIn=null,masterGain=null,masterChain=null,masterClip=null,buses=[];

class Strip{
  constructor(ch){
    this.type=ch.type; this.inst=new INSTR[ch.type].cls(ctx,ch.params,ch.id);
    this.gain=ctx.createGain(); this.pan=ctx.createStereoPanner();
    this.an=ctx.createAnalyser(); this.an.fftSize=256; this.buf=new Float32Array(256); this.lvl=0;
    this.sa=ctx.createGain(); this.sb=ctx.createGain();
    this.tap=ctx.createGain(); this.chain=new FxChain(this.inst.out,this.tap); this.duckG=ctx.createGain(); this.tap.connect(this.duckG); this.duckG.connect(this.gain);
    this.gain.connect(this.pan); this.pan.connect(masterIn); this.pan.connect(this.an);
    this.pan.connect(this.sa); this.pan.connect(this.sb); this.sa.connect(buses[0].in); this.sb.connect(buses[1].in);
    this.chain.sync(ch.fx);
  }
  setMix(ch,anySolo,hid){
    const audible=!ch.mute&&(!anySolo||ch.solo)&&!hid,t=ctx.currentTime; this.audible=audible;
    const set=(p,x)=>{ if(this.inited)p.setTargetAtTime(x,t,.015); else p.value=x; };
    set(this.gain.gain,audible?ch.vol*ch.vol*trimGain(ch):0); set(this.pan.pan,clamp(ch.pan,-1,1)); set(this.sa.gain,ch.sendA); set(this.sb.gain,ch.sendB); this.inited=true;
  }
  peak(){ this.an.getFloatTimeDomainData(this.buf); let m=0; for(let i=0;i<this.buf.length;i++){ const a=Math.abs(this.buf[i]); if(a>m)m=a; } return m; }
  dispose(){ try{this.inst.dispose();}catch(e){} try{this.chain.dispose();}catch(e){} try{this.tap.disconnect();this.pan.disconnect();this.gain.disconnect();this.sa.disconnect();this.sb.disconnect();}catch(e){} }
}
function duckHit(src,t,pitch){
  for(const c of P.channels){
    if(c.duckSrc!==src.id||!(c.duck>0))continue; if(isDrumCh(src)&&c.duckKick!==false&&pitch!==INSTR[src.type].range.lo)continue;
    const st=strips.get(c.id); if(!st||!st.duckG)continue; const g=st.duckG.gain,r=Math.max(.04,c.duckRel||.2);
    g.setTargetAtTime(1-c.duck,t,.004); g.setTargetAtTime(1,t+.03,r/3);
  }
}
function ensureAudio(){
  if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC({latencyHint:audioLatencyHint()});
    masterIn=ctx.createGain(); masterGain=ctx.createGain();
    limiter=ctx.createDynamicsCompressor(); limiter.threshold.value=-2; limiter.knee.value=0; limiter.ratio.value=20; limiter.attack.value=.002; limiter.release.value=.12;
    masterAn=ctx.createAnalyser(); masterAn.fftSize=512; masterAn.buf=new Float32Array(512);
    masterChain=new FxChain(masterIn,masterGain);
    masterGain.connect(limiter); masterClip=ctx.createWaveShaper(); masterClip.curve=Float32Array.from([-1,1]); limiter.connect(masterClip); masterClip.connect(ctx.destination); setupLoudness(); if(masterMono)setMasterMono(true); masterClip.connect(masterAn);
    buses=[0,1].map(()=>({in:ctx.createGain(),level:ctx.createGain(),fx:null,fid:null}));
    buses.forEach(b=>b.level.connect(masterIn));
    metroGain=ctx.createGain(); metroGain.gain.value=.25; metroGain.connect(ctx.destination);
    setMasterVol(); syncEngine();
  }
  if(ctx.state!=='running')ctx.resume().catch(()=>{});
  return ctx;
}
function setMasterVol(){ if(masterGain){ const v=masterTargetGain(); if(masterGain._i)masterGain.gain.setTargetAtTime(v,ctx.currentTime,.02); else { masterGain.gain.value=v; masterGain._i=true; } } }
function syncBuses(){
  P.sends.forEach((s,i)=>{
    const b=buses[i]; if(!b)return;
    if(!b.fx||b.fid!==s.fx.id||b.ftype!==s.fx.type){
      if(b.fx)b.fx.dispose();
      b.fx=new FX[s.fx.type].cls(ctx,s.fx.params); b.fid=s.fx.id; b.ftype=s.fx.type;
      try{b.in.disconnect();}catch(e){} b.in.connect(b.fx.in); b.fx.out.connect(b.level);
    } else b.fx.setValues(s.fx.params);
    { const lv=s.fx.bypass?0:s.level*s.level; if(b.inited)b.level.gain.setTargetAtTime(lv,ctx.currentTime,.015); else { b.level.gain.value=lv; b.inited=true; } }
  });
}
function syncEngine(){
  if(!ctx)return;
  pruneAutomation(); syncBuses(); masterChain.sync(P.masterFx); setMasterVol();
  const ids=new Set(P.channels.map(c=>c.id));
  for(const [id,s] of [...strips]){ if(!ids.has(id)){ s.dispose(); strips.delete(id); } }
  const anySolo=P.channels.some(c=>c.solo),hid=hiddenSources();
  for(const ch of P.channels){
    let s=strips.get(ch.id);
    if(!s||s.type!==ch.type){ if(s)s.dispose(); s=new Strip(ch); strips.set(ch.id,s); }
    else { s.inst.setValues(ch.params); s.chain.sync(ch.fx); }
    s.setMix(ch,anySolo,hid.has(ch.id));
  }

    } else ph.style.display='none';

      const pk=s.peak(); s.lvl=Math.max(pk,s.lvl*0.88);

  }

  if(heavyFrame())for(const f of [...vizTick])f();
  { const nowT=performance.now(); if(R.dirty||(R.ghosts&&R.ghosts.length)||(play.on&&nowT-lastRollDraw>rollInterval())){ lastRollDraw=nowT; drawRoll(); R.dirty=false; } }
}

  addEventListener('error',e=>{ if(e&&e.message&&!/ResizeObserver/.test(e.message))oops(); });
  addEventListener('unhandledrejection',e=>{ const m=String((e.reason&&e.reason.message)||e.reason||''); if(!/AbortError|NotAllowed|interrupted/i.test(m))oops(); }); }

/* =====================================================================
   INFO (i) BUTTONS: a few small explainers. One per instrument window,
   plus a handful of confusing controls. Can be switched off in
   Settings > Input and behavior.
   ===================================================================== */
(function(){
  const ENV='Attack, Decay, Sustain, Release: the volume shape of each note (fade in, fall, held level, fade out).';
  const FIL='Cutoff: where the filter cuts; lower is darker. Resonance: boosts the sound right at the cutoff.';
  const LFO='Shape, Rate, Depth, Delay, Source, Target, Amount: an LFO is a slow wave that wobbles the Target (pitch, filter, volume...). Rate is speed, Depth/Amount is how far, Delay waits before it starts.';
  const INST={
   'EzSynth':['Wave, Level, Octave, Semi, Fine: oscillator shape, its volume and its pitch (octaves, semitones, cents).','Pulse width: hollow to thin tone of pulse waves.','Unison, Spread, Voices: stacks detuned copies for a fatter sound. Spread is how far apart they are.','FM amount: one oscillator bends another for metallic, bell-like tones.',FIL+' Key track makes the filter follow the note pitch. Env 2 amount: how much a second envelope opens the filter.',ENV,LFO,'Drive, Bits: distortion and bit crushing. Mix, Time, Feedback: echo.','Glide: slide between notes. Velocity sens.: how much note loudness changes the sound.'],
   'SynthesisPro':['Wavetable, Position: a wavetable is a row of waveforms; Position morphs between them.','Warp, Warp amount: bends the wave shape for harsher or more vocal tones.','Unison, Detune, Stereo: stacked copies, how out of tune they are, and how wide they spread.','FM / ring amt: one oscillator modulates another for metallic tones.',FIL+' Env 2 amount: how much a second envelope opens the filter.',ENV,LFO,'Drive, Bits: distortion and bit crushing. Mix, Time, Feedback, Damping: echo and its darkness.','Voices: how many notes can play at once. Glide: slide between notes.'],
   'Chip':['Wave: classic console-style waveforms. Voices: how many notes play at once.',ENV,'Arpeggio, Arp speed: rapidly cycles through the notes of a chord to fake a chord on one voice.','Slide, Slide time: pitch slides at the start of a note.','Vibrato rate, depth, delay: pitch wobble, and how long until it begins.','Duty sweep, Sweep speed: steps a pulse wave through 12.5%, 25% and 50% for that moving NES buzz.','Custom 4-bit wave: draw your own 32-step wave (Game Boy style), then set Wave to Custom 4-bit.','Bit crush: lo-fi grit. Echo mix, time, feedback: repeats.'],
   'Chip Drums':['Rate, Decay, Tone: speed of the noise, how long it rings, and how bright it is.','Mode: switches between the noise styles. Pitch drop: how far the pitch falls at the start (for kicks and toms).','Level, Envelope: loudness and its shape. "Note end cuts the sound" stops the hit when the note ends.'],
   'Drums':['Each pair of knobs tunes one drum: Tune changes pitch, Decay changes how long it rings.','Kick, Snare, Clap, Hat, Open hat, Tom each play on their own piano-roll row.','"Note end cuts the sound": a hit stops when its note ends instead of ringing out.'],
   'Soundfont':['A soundfont (.sf2) is a file of recorded instruments. Pick a built-in sound, browse for a file or paste a URL, then choose a preset from the list.','Extra attack: slows the fade-in. Release: how long it rings after the key is released.','Tune: pitch. Cutoff, Resonance: darken or sharpen the sound.'],
   'SynthKid':['Algorithm: FM synthesis uses operators that modulate each other. The algorithm decides who modulates whom and changes the tone a lot.','Feedback operator, Feedback: one operator modulates itself for a brighter, rougher tone.','The operator panels set each one\u2019s pitch ratio, level and envelope.'],
   'Vokoder':['A vocoder makes a Carrier sound (a synth or another channel) speak with the shape of a Modulator (your voice or a sample).','Bands, Low freq, High freq, Bandwidth: how finely the voice is sliced into frequency bands and over what range.','Formant shift: moves the vowel character up or down. Envelope speed: how quickly it follows the voice.','Boost, Noise gate, Sibilance: lift quiet detail, mute silence, add "s" and "t" clarity. Carrier dry / Modulator dry: mix in the originals.'],
   'Sampler':['Plays your own audio file as an instrument. Gain: volume. Pitch, Fine tune: change speed and pitch together.','Reverse: plays backwards. Fade in, Fade out: soften the start and end.','High-pass, Low-pass: cut lows or highs from the sample.']
  };
  const S=[ // [selector, title, text]
   ['#lcdPos','Position display','Shows where playback is as bar : beat : step. Steps are the small grid cells inside each beat.'],
   ['#modeSeg','Playback mode','Song plays every bar in order. Bar loop repeats only the selected bar, which is handy while writing a part.'],
   ['#bFollow','Follow','When on, the piano roll switches to whichever pattern is playing so you can watch the song go by.'],
   ['#rbChan','Piano roll','Editor for the selected channel and bar. Click to draw a note, drag to move it, drag a note\u2019s edge to resize. Up and down is pitch, left and right is time.'],
   ['#selRoot','Key and scale','Pick the song\u2019s key and scale. The piano roll highlights notes that belong to it... Snap to scale keeps new notes inside it.'],
   ['#selSnap','Grid','The smallest time step notes snap to. Finer means more precise placement.'],
   ['#bQol','QOL tools','Helpers like Strum, Humanize and chord generation that act on your notes.'],
   ['.mhint','Mixer','Each strip is one channel... fader is volume, meters show level, effects run top to bottom. Send strips are shared effects channels feed into. Master is the final output.']
  ];
  let pop=null,pb=null;
  const closePop=()=>{ if(pop){ pop.remove(); pop=null; } if(pb){ pb.classList.remove('open'); pb=null; } };
  const para=(t)=>{ const p=document.createElement('p'),i=t.indexOf(': ');
    if(i>0&&i<46){ const b=document.createElement('b'); b.textContent=t.slice(0,i+1); p.append(b,' '+t.slice(i+2)); } else p.textContent=t; return p; };
  function show(btn,title,text){
    const same=pb===btn; closePop(); if(same)return;
    const p=document.createElement('div'); p.className='ibpop'; p.setAttribute('role','tooltip');
    const h=document.createElement('b'); h.className='t'; h.textContent=title; p.append(h);
    (Array.isArray(text)?text:[text]).forEach(t=>p.append(para(t)));
    document.body.append(p); pop=p; pb=btn; btn.classList.add('open');
    const r=btn.getBoundingClientRect(),w=p.offsetWidth,hh=p.offsetHeight;
    p.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';
    p.style.top=(r.bottom+hh+10<innerHeight?r.bottom+6:Math.max(8,r.top-hh-6))+'px';
  }
  function mk(title,text){
    const b=document.createElement('button'); b.type='button'; b.className='ib'; b.textContent='i';
    b.setAttribute('aria-label','About '+title); b.title='What is this?';
    ['pointerdown','mousedown','dblclick','contextmenu'].forEach(ev=>b.addEventListener(ev,e=>e.stopPropagation()));
    b.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); show(b,title,text); });
    return b;
  }
  const done=new WeakSet();
  function put(node,title,text,inside){
    if(!node||done.has(node))return; done.add(node); const b=mk(title,text);
    if(inside)node.append(b); else node.insertAdjacentElement('afterend',b);
  }
  function scan(){
    for(const [sel,t,x] of S) document.querySelectorAll(sel).forEach(n=>{
      if(sel==='.mhint')put(n,t,x,true); else put(n.closest('label.field')||n,t,x);
    });
    document.querySelectorAll('.win').forEach(w=>{
      const st=w.querySelector('.win-h .st'); if(!st)return;
      if([...w.querySelectorAll('.wx button')].some(b=>/bypass/i.test(b.textContent)))return; // effect window
      let name=st.textContent.trim().replace(/ \(experimental\)$/,''); if(name==='(experimental)'){ const tt=w.querySelector('.win-h .t'); if(tt)name=tt.textContent.trim(); } const t=INST[name];
      put(st,name+' controls',t||['Drag a knob up or down to change it (hold Shift for fine control), scroll to nudge, double-click to reset.','Right-click a knob to automate it over time, if the knob supports it.']);
    });
  }
  const apply=()=>document.body.classList.toggle('noib',settings.infoButtons===false);
  let q=0; const sched=()=>{ if(q)return; q=requestAnimationFrame(()=>{ q=0; try{ scan(); }catch(e){} }); };
  new MutationObserver(m=>{ if(m.some(r=>[...r.addedNodes].some(n=>n.nodeType===1&&!(n.classList&&(n.classList.contains('ib')||n.classList.contains('ibpop'))))))sched(); }).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('pointerdown',e=>{ if(pop&&!e.target.closest('.ib,.ibpop'))closePop(); },true);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&pop){ closePop(); e.stopPropagation(); } },true);
  document.addEventListener('change',e=>{ if(e.target.closest&&e.target.closest('.settings'))setTimeout(()=>{ apply(); closePop(); },0); },true);
  addEventListener('resize',closePop); addEventListener('blur',closePop);
  apply(); scan();
})();

/* ---- floating windows follow the browser window size ---- */
(function(){
  let lw=innerWidth,lh=innerHeight,tm=0;
  addEventListener('resize',()=>{ clearTimeout(tm); tm=setTimeout(()=>{
    const kx=innerWidth/lw,ky=innerHeight/lh; lw=innerWidth; lh=innerHeight;
    wins.forEach(w=>{ const e=w.el,r=e.getBoundingClientRect(),mw=parseFloat(getComputedStyle(e).minWidth)||300;
      if(w.W0){ e.style.left=r.left*kx+'px'; e.style.top=r.top*ky+'px'; setWinScale(w,clamp(w.s*Math.min(kx,ky),.5,Math.min(2.2,(innerWidth-8)/w.W0,(innerHeight-8)/w.H0))); return; }
      const W=clamp(r.width*kx,Math.min(mw,innerWidth-8),innerWidth-8),H=clamp(r.height*ky,Math.min(200,innerHeight-8),innerHeight-8);
      e.style.width=W+'px'; e.style.height=H+'px'; e.style.left=clamp(r.left*kx,0,Math.max(0,innerWidth-W))+'px'; e.style.top=clamp(r.top*ky,0,Math.max(0,innerHeight-H))+'px'; });
  },80); });
})();

/* ---- uniform window scaling helpers ---- */
function setWinScale(w,s){
  const e=w.el; w.s=s; e.style.transform='scale('+s+')'; const r=e.getBoundingClientRect(),vw=w.W0*s,vh=w.H0*s;
  e.style.left=Math.max(0,Math.min(r.left,innerWidth-vw))+'px'; e.style.top=Math.max(0,Math.min(r.top,innerHeight-vh))+'px';
}
function lockWin(w,fixedW){
  const e=w.el; if(w.W0||!/^([if]:|mixer$)/.test(w.key))return; e.classList.add('plug'); e.style.transform='none';
  const W0=Math.round(fixedW||e.offsetWidth||640); e.style.width=W0+'px';
  const tb=[...w.tabs.querySelectorAll('button')],cur=tb.find(b=>b.classList.contains('on')); let H=0;
  const meas=()=>{ e.style.height='auto'; H=Math.max(H,Math.ceil(e.getBoundingClientRect().height)); };
  if(tb.length){ tb.forEach(b=>{ b.click(); meas(); }); if(cur)cur.click(); } else meas();
  w.W0=W0; w.H0=clamp(H,220,1000); e.style.width=w.W0+'px'; e.style.height=w.H0+'px';
  const s0=clamp(Math.min(innerWidth/1440,innerHeight/860),.85,1.3);
  setWinScale(w,Math.max(.5,Math.min(s0,(innerWidth-16)/w.W0,(innerHeight-16)/w.H0)));
}

/* ---- Reset memory ---- */
function buildResetBox(){
  return el('div',{class:'resetbox'},el('h4',null,'Reset memory'),
    btn('Reset memory...',async()=>{ if(!await askConfirm('Reset everything this app saves and start fresh? This also erases the autosaved project and cannot be undone.','Reset memory'))return; resetMemory(); },'btn','Erase all saved data and reload'));
}
async function resetMemory(){
  clearTimeout(saveTimer);
  const wipe=()=>{ try{ Object.keys(localStorage).forEach(k=>{ if(k===KEY||/^(patternloops|loopbox)\./.test(k))localStorage.removeItem(k); }); }catch(e){} };
  wipe(); try{ Storage.prototype.setItem=function(){}; }catch(e){}
  try{ await new Promise(r=>{ const q=indexedDB.deleteDatabase('loopbox'); q.onsuccess=q.onerror=q.onblocked=()=>r(); setTimeout(r,1500); }); }catch(e){}
  wipe(); location.reload();
}
